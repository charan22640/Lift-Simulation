<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Simulation</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lift Simulation</h1>
        </header>

        <!-- Configuration Panel -->
        <div class="config-panel">
            <div class="input-group">
                <label for="floors">Number of Floors:</label>
                <input type="number" id="floors" min="2" max="10" value="5">
            </div>
            <div class="input-group">
                <label for="lifts">Number of Lifts:</label>
                <input type="number" id="lifts" min="1" max="5" value="2">
            </div>
            <button id="generate-btn">Generate Simulation</button>
        </div>

        <!-- Malfunction Controls -->
        <div class="malfunction-panel">
            <h3>Lift Malfunction Controls</h3>
            <div class="malfunction-controls">
                <input type="number" id="malfunction-lift-id" min="1" placeholder="Lift Number">
                <button id="disable-lift-btn">Disable Lift</button>
                <button id="enable-all-lifts-btn">Enable All Lifts</button>
            </div>
            <div id="malfunction-status" class="status-display"></div>
        </div>

        <!-- Simulation Area -->
        <div class="simulation-container">
            <div id="building" class="building">
                <!-- Dynamic content will be generated here -->
            </div>
        </div>

        <!-- Status Panel -->
        <div class="status-panel">
            <h3>Lift Status</h3>
            <div id="lift-status" class="lift-status-container">
                <!-- Lift status will be displayed here -->
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
